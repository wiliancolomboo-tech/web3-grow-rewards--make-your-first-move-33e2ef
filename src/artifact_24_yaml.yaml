version: "3.8"

services:
  grow-rewards-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grow-rewards-daemon
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=GrowRwds11111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL_FROM=rewards@growprotocol.io
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"