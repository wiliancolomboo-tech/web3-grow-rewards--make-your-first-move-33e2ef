version: "3.8"

services:
  grow-rewards-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grow_rewards_daemon
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=GrwRew1111111111111111111111111111111111111
      - AUTHORITY_PRIVATE_KEY="mock_development_token_00000000000000"
      - RESEND_API_KEY=re_test_000000000000000000000000
      - NOTIFICATION_EMAIL_FROM=rewards@growprotocol.io
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"