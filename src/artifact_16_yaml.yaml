version: "3.8"

services:
  grow-rewards-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grow-rewards-worker
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=GrowRwds11111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=rewards@grow.solana.xyz
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"