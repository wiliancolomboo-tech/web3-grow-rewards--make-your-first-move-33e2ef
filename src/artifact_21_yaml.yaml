version: "3.8"

services:
  grow-rewards-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grow-rewards-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=GrowRwds111111111111111111111111111111111111
      - ORACLE_SECRET_KEY=[12,45,23,89,122,...]
      - RESEND_API_KEY=re_123456789abcdef
      - RESEND_FROM_EMAIL=rewards@grow.solana.io
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PORT=8080
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"