version: "3.8"

services:
  grow-rewards-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grow_rewards_sentinel
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"